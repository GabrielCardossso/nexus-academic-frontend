<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="306" viewBox="0 0 1200 306" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Sobre nexus-academic-frontend</title>
<desc id="desc">Front-end do sistema Nexus, projeto acadêmico do SENAC: cadastros de clientes, produtos e colaboradores e pedidos de venda e aluguel, consumindo uma API em Java / Spring Boot.</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" opacity=".06"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern>
<clipPath id="card"><rect width="1200" height="306" rx="10"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="306" fill="#191817"/>
<rect width="1200" height="306" fill="url(#grid)"/>
<rect width="1200" height="40" fill="#262422"/>
<rect y="40" width="1200" height="1" fill="#3a3733"/>
<rect x="20" y="14" width="12" height="12" fill="#e5534b"/>
<rect x="40" y="14" width="12" height="12" fill="#e0a43b"/>
<rect x="60" y="14" width="12" height="12" fill="#5fb85f"/>
<text x="600" y="25" text-anchor="middle" class="mono" font-size="14" fill="#86817a">sobre.md</text>
<rect x="48" y="78" width="10" height="10" fill="#d97757"/>
<text x="70" y="88" class="mono" font-size="18" font-weight="700" fill="#ece9e4">Sobre o projeto</text>
<text x="70" y="122" class="mono" font-size="16" fill="#b7b2aa" xml:space="preserve">Front-end do sistema<tspan font-weight="700" fill="#ece9e4"> Nexus</tspan>, projeto acadêmico do SENAC: cadastros de<tspan font-weight="700" fill="#ece9e4"> clientes</tspan>,<tspan font-weight="700" fill="#ece9e4"> produtos</tspan> e<tspan font-weight="700" fill="#ece9e4"> colaboradores</tspan> e</text>
<text x="70" y="149" class="mono" font-size="16" fill="#b7b2aa" xml:space="preserve">pedidos de<tspan font-weight="700" fill="#ece9e4"> venda</tspan> e<tspan font-weight="700" fill="#ece9e4"> aluguel</tspan>, consumindo uma API em Java / Spring Boot.</text>
<rect x="48" y="180" width="1104" height="1" fill="#3a3733"/>
<rect x="72" y="201" width="7" height="7" fill="#d97757"/>
<text x="92" y="210" class="mono" font-size="15" fill="#b7b2aa" xml:space="preserve"><tspan font-weight="700" fill="#ece9e4">React</tspan>,<tspan font-weight="700" fill="#ece9e4"> TypeScript</tspan> e<tspan font-weight="700" fill="#ece9e4"> Vite</tspan></text>
<rect x="72" y="231" width="7" height="7" fill="#d97757"/>
<text x="92" y="240" class="mono" font-size="15" fill="#b7b2aa" xml:space="preserve">Parte de um sistema dividido em três repositórios (front, back e integração)</text>
<rect x="72" y="261" width="7" height="7" fill="#d97757"/>
<text x="92" y="270" class="mono" font-size="15" fill="#b7b2aa" xml:space="preserve">Projeto do<tspan font-weight="700" fill="#ece9e4"> Técnico</tspan><tspan font-weight="700" fill="#ece9e4"> em</tspan><tspan font-weight="700" fill="#ece9e4"> Desenvolvimento</tspan><tspan font-weight="700" fill="#ece9e4"> de</tspan><tspan font-weight="700" fill="#ece9e4"> Sistemas</tspan> · SENAC</text>
<rect width="1200" height="306" fill="url(#scan)"/>
</g>
<rect x=".5" y=".5" width="1199" height="305" rx="9.5" fill="none" stroke="#3a3733"/>
