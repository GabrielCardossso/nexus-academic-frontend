<text x="68" y="196" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">cadastra, edita e desativa/reativa, com CNPJ e CPF</text>
<text x="68" y="218" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">validados.</text>
