<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="512" viewBox="0 0 1200 512" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Funcionalidades de nexus-academic-frontend</title>
<desc id="desc">Cadastros: Clientes Normal ou VIP, produtos e colaboradores: cadastra, edita e desativa/reativa, com CNPJ e CPF validados. · Pedidos de venda e aluguel: Prévia com subtotal, desconto e total; PIX, à vista ou a prazo com limite de crédito. · Aprovação de descontos: Solicitações pendentes e decididas, aprovadas ou rejeitadas por um colaborador ativo. · Inadimplência calculada: Cliente com pedido a prazo vencido fica inadimplente: sem a prazo e sem desconto. · Nada é excluído: Cadastros são desativados e pedidos cancelados; o histórico guarda nome e preço do momento. · Modo local: Back-end &quot;de mentira&quot; no localStorage, com 17 pedidos de exemplo cobrindo todos os cenários.</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" opacity=".06"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern>
<clipPath id="card"><rect width="1200" height="512" rx="10"/></clipPath>
</defs>
