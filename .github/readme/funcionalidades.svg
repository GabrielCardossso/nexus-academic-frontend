<text x="600" y="25" text-anchor="middle" class="mono" font-size="14" fill="#86817a">funcionalidades.md</text>
<rect x="48" y="78" width="10" height="10" fill="#d97757"/>
<text x="70" y="88" class="mono" font-size="18" font-weight="700" fill="#ece9e4">Funcionalidades</text>
